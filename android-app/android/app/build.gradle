apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

react {
}

def reactNativeDir = file(["node", "-e", "console.log(require.resolve('react-native/package.json'))"].execute(null, rootDir).text.trim().parent)

android {
    namespace "com.evoagent"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.evoagent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    // JS 打包默认走 metro bundle；OTA 演示可用 CodePush 直接替换 JS bundle（见 README）
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.7.0")
}

apply from: file("../../node_modules/@react-native/community-cli-plugin/cli.js")
